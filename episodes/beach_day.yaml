title: Beach Day
style: film3d_bear_storybook_world   # LOCKED series look
image_model: nano_banana_21          # LOCKED
video_model: kling_v4                # LOCKED (user chose standard over Flash for this episode, 2026-11-28)
personality: playful

approved: false                      # GATE 1: set true ONLY after the user approves the script + prompts
keyframes_approved: false            # GATE 2: set true ONLY after the user picks keyframes

# OUTFIT (same in every shot, user request): red-and-white striped swim trunks,
# small round straw sun hat with a pink ribbon, white stripe of sunblock across his nose.

setting: >-
  a sunny storybook seaside beach with soft golden sand, pastel beach huts,
  striped beach umbrellas, little seashells, gentle turquoise waves and a
  bright blue sky with puffy white clouds

shots:
  - id: s1_hot_sand
    duration: 3
    beat: Hot sand
    keyframe: >-
      {name} wearing red-and-white horizontally striped swim trunks, a small
      round straw sun hat with a pink ribbon, and a thick white stripe of
      sunblock cream across the top of his brown suede nose, standing at the
      edge of a wooden boardwalk where it meets the golden sand, a rolled-up
      blue-and-white striped beach towel tucked under one arm, one bare foot
      lifted and just about to step onto the sand, beaming excited grin, the
      beach and the sea behind him, NOT yet on the sand
    motion: >-
      {name} steps off the boardwalk onto the sand with a happy grin. Within
      the first second his eyes pop wide and his cheeks puff out as the sand is
      scorching hot. He hops quickly from one foot to the other, knees high,
      the rolled towel bouncing under his arm, then sprints away across the
      sand in fast little tiptoe steps toward the sea, glancing back at the
      camera with a pained, wide-eyed "ouch ouch" grimace.
    camera: static medium-wide shot, eye level, the boardwalk edge and the sand in frame
    continuity: the red-and-white striped swim trunks stay on, the straw sun hat with the pink ribbon stays on his head, the white sunblock stripe stays on his nose, and the striped towel stays rolled under his arm, all keeping their colors
    sfx: seagulls, gentle waves, quick soft sandy footsteps, a little surprised "hoo-hoo"
  - id: s2_sandcastle
    duration: 5
    beat: Sandcastle
    # physical gag: the cause (the incoming wave) is visible in the keyframe
    keyframe: >-
      {name} wearing the red-and-white striped swim trunks, the straw sun hat
      with the pink ribbon and the white sunblock stripe on his nose, kneeling
      on wet sand beside a tall finished sandcastle with three round towers
      that is as tall as he is, a small red plastic bucket and spade next to
      him, patting the top of the tallest tower with one paw and grinning
      proudly at the camera; behind the sandcastle the sea is close, and one
      foamy wave is already rolling in toward the castle, NOT yet reaching it;
      his fur is completely dry
    motion: >-
      {name} gives the top of the tallest tower one last proud pat and turns to
      the camera with a big pleased grin, paws spread like "ta-da". Around the
      two-second mark the foamy wave rushes up the sand behind him, swirls
      around the castle and around him up to his tummy, and the whole sandcastle
      slumps and melts down into a flat smooth lump of wet sand. The water slides
      back out to sea. For the last two seconds he sits there soaked from the
      tummy down, water dripping from his hat brim, holding the little red spade,
      stares at the flat lump where the castle was, then looks at the camera with
      a flat, unimpressed pout.
    camera: static medium shot, eye level, the bear, the whole sandcastle and the incoming wave in frame
    continuity: the red-and-white striped swim trunks, the straw sun hat with the pink ribbon and the white sunblock stripe on his nose all stay on; the bucket stays red; there is only one sandcastle and it only melts down, it never moves or floats away
    sfx: waves, a big rushing whoosh of a wave, fizzing foam, a soft sandy slump, water dripping, seagulls
  - id: s3_crab_pinch
    duration: 5
    beat: Crab pinch
    keyframe: >-
      {name} wearing the red-and-white striped swim trunks, the straw sun hat
      with the pink ribbon and the white sunblock stripe on his nose, lying on
      his back on the blue-and-white striped beach towel under a pastel striped
      beach umbrella, paws behind his head, eyes closed, a blissful relaxed
      smile, sunbathing; one small bright red crab sits on the sand right
      beside his bare feet, claws raised, NOT yet touching him
    motion: >-
      {name} lies sunbathing with a blissful smile. Within the first two
      seconds the little red crab scuttles sideways onto the towel and clamps
      one claw onto his big toe. His eyes snap open wide and he springs
      straight up onto his feet, hopping on one leg while holding the other foot
      up with the crab dangling from his toe. He shakes his foot hard and the crab
      lets go, drops onto the sand and scuttles away sideways. For the last
      second he clutches his toe, then glares after the crab with a grumpy,
      puffed-cheek pout.
    camera: static medium-wide shot, eye level, the whole towel, the umbrella and the crab in frame
    continuity: the red-and-white striped swim trunks, the straw sun hat with the pink ribbon and the white sunblock stripe on his nose all stay on; there is exactly one small red crab, it stays crab sized; the towel stays blue-and-white striped
    sfx: gentle waves, tiny clicking crab claws, a squeaky "eep!", soft thumping hops on sand, seagulls
  - id: s4_seagull_thief
    duration: 5
    beat: Seagull thief
    # physical gag: the seagull (the cause) is already standing right behind him in the keyframe
    keyframe: >-
      {name} wearing the red-and-white striped swim trunks, the straw sun hat
      with the pink ribbon and the white sunblock stripe on his nose, sitting
      on the blue-and-white striped towel on the sand, holding a big honey
      sandwich (two thick slices of soft white bread with golden honey
      dripping from the edges) up to his open mouth in both paws, eyes closed
      in happy anticipation, about to take a bite; one plump white seagull with
      a yellow beak stands on the sand right behind his shoulder, staring at
      the sandwich, wings folded, NOT yet moving
    motion: >-
      {name} brings the honey sandwich toward his mouth with his eyes closed.
      Within the first second the seagull flaps up and clamps its beak onto
      the far end of the sandwich. His eyes snap open and he grips his end
      tight: a quick tug-of-war, the bear leaning back and the seagull
      flapping hard. Around the three-second mark the seagull gives one big
      yank, the bear is pulled forward off the towel and lands face-first in
      the sand, and the seagull flies off up into the sky with the whole
      sandwich. For the last second he lifts his head, his face covered in
      sand, paws empty, and gives the camera a flat, betrayed stare.
    camera: static medium-wide shot, eye level, the bear, the towel and the seagull all in frame with room above for the seagull to fly away
    continuity: the red-and-white striped swim trunks, the straw sun hat with the pink ribbon and the white sunblock stripe on his nose all stay on; there is exactly one seagull, white with a yellow beak, ordinary seagull sized; there is exactly one sandwich
    sfx: seagull squawks, flapping wings, a stretchy tugging creak of bread, a soft sandy flump, waves
  - id: s5_surfs_up
    duration: 5
    beat: Surf's up
    keyframe: >-
      {name} wearing the red-and-white striped swim trunks, the straw sun hat
      with the pink ribbon and the white sunblock stripe on his nose, already
      standing up on a small pastel mint-green surfboard, riding a small gentle
      curling wave close to the shore at golden sunset, knees bent, both arms
      stretched out wide for balance, a wobbly, wide-eyed but excited grin, the
      sea glowing orange and pink behind him, the sandy shore just ahead of
      him; he has NOT fallen off and NOT yet reached the shore
    motion: >-
      {name} wobbles on the surfboard, arms windmilling, then finds his
      balance and stands taller, riding the little wave toward the shore with
      a proud, delighted grin and one paw raised high in a "woo" gesture. The
      wave carries the board gently up onto the shallow wet sand, where it
      slides to a stop. Around the three-second mark he hops off the board onto
      the sand, plants his fists on his hips, puffs out his chest and strikes a
      proud hero pose beside the surfboard, the sunset glowing behind him, with
      a big beaming smile at the camera.
    camera: static wide shot, eye level, the bear, the surfboard, the wave and the shore all in frame
    continuity: the red-and-white striped swim trunks, the straw sun hat with the pink ribbon and the white sunblock stripe on his nose all stay on; there is exactly one surfboard and it stays pastel mint green
    sfx: rolling waves, a whooshing surf glide, a sandy swish as the board stops, a soft hop onto sand, distant seagulls

music:
  duration: 23
  mood: sunny breezy beach music with ukulele, steel drums, bouncy marimba and light hand percussion, building to a bright triumphant surf finale
