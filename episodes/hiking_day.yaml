title: Hiking Day
style: film3d_bear_storybook_world   # LOCKED series look
image_model: nano_banana_21          # LOCKED
video_model: kling_v4                # LOCKED
personality: playful

approved: true                       # script approved 2026-11-28
keyframes_approved: true             # picks B,B,B,A + new peak v1, approved 2026-11-28

setting: >-
  a sunny storybook hiking trail through rolling green hills, with a winding
  dirt path, wildflowers, tall round pine trees, a little sparkling stream with
  flat stepping stones, and soft blue mountains in the distance

shots:
  - id: s1_trailhead
    duration: 3                       # user: shorter so the pinecone gag gets more time
    lock_clip: true
    keyframe_pick: 2
    beat: Trailhead
    keyframe: >-
      {name} wearing a small mustard-yellow bucket hat and a little red
      backpack with both straps over his shoulders, standing at the start of a
      dirt trail beside a small wooden trail post with no writing on it, both
      paws gripping his backpack straps, chest puffed out and an excited,
      determined grin, standing still and NOT yet walking
    motion: >-
      {name} takes one big excited breath, puffing his chest out even more, and
      gives a firm little nod at the camera. Within the first second he
      turns to face along the trail and starts marching away from the post with
      big exaggerated proud steps, knees lifting high and both arms swinging
      back and forth, the red backpack bouncing on his back with each step. After
      three quick steps he glances back over his shoulder at the camera with a big
      cheeky grin and keeps marching up the path.
    camera: static medium-wide shot, eye level, the trail and the post in frame
    continuity: the mustard-yellow bucket hat stays on his head and the red backpack stays on his back the whole time, keeping their colors
    sfx: birdsong, a light breeze, crunchy little footsteps on the dirt path, the backpack softly jostling
  - id: s2_stepping_stones
    duration: 5
    lock_clip: true
    keyframe_pick: 1                  # take 2: user picked A (2026-11-28)
    beat: Stepping stones
    # take 2: the cause of the fall (one wobbly stone) is set up in the keyframe; one physical event
    keyframe: >-
      {name} wearing the mustard-yellow bucket hat and red backpack, standing
      on ONE big round grey stepping stone that sits half out of the water in
      the middle of a shallow, clear, sparkling stream, seen from the side; the
      stone is rounded like a dome and already tilted slightly forward, with a
      little gap of water under its front edge; his arms are stretched out
      wide to his sides for balance, knees bent, eyes wide and nervous,
      concentrating; his fur is completely dry and he is NOT yet falling or in
      the water; flat stones lie behind him on the bank he came from
    motion: >-
      {name} holds his balance on the round stone for a moment, arms wide.
      Then, within the first two seconds, the round stone slowly rocks forward
      under his weight like a seesaw; he windmills both arms faster and faster
      and leans back, but his feet slide down the stone's sloping front edge.
      He slips off the front of the stone and sits down bottom-first in the
      shallow water with a big splash, landing right beside the stone, water up
      to his tummy. The stone rocks back and settles in the same place; it
      stays a big grey stone the whole time. For the last two seconds he sits in
      the water, water dripping from the brim of his hat, blinks, looks down at
      the water, then looks up at the camera with a sheepish, soggy grin.
    camera: static medium shot from the side, eye level, the stone, the bear and the water around him all in frame
    continuity: the mustard-yellow bucket hat and red backpack stay on him; there is exactly one round stone and it never leaves the water or flips over, it only rocks forward and back; the stream stays shallow and clear
    sfx: babbling stream, a low stony rocking clunk, a surprised little "whoa", one big splash, water dripping
  - id: s3_pinecone_bonk
    duration: 7                       # user: longer, gives the 3-part gag room
    lock_clip: true
    keyframe_pick: 2
    beat: Pinecone bonk
    keyframe: >-
      {name} wearing the mustard-yellow bucket hat and red backpack, standing
      on the dirt path directly underneath a tall pine tree whose branches hang
      right above his head, his whole head tipped far back so his face points
      straight UP at the branches, chin raised high, wide curious eyes and a
      little open mouth, both paws empty at his sides; a cluster of brown
      pinecones hangs in the branches right above him, NONE of them falling yet
    motion: >-
      Within the first two seconds, one brown pinecone drops from the branches and
      bonks {name} right on top of his bucket hat, squashing the hat down over
      his eyes; he wobbles, pushes the hat back up with one paw and blinks in
      surprise. A second pinecone falls and he lunges sideways and catches it in
      both paws, then holds it up toward the camera with a smug, triumphant grin.
      Behind his back the whole branch shakes and, around the four-second mark,
      a big shower of dozens of pinecones pours down on him all at once,
      burying him in a tall heap of brown pinecones right up to his chin. For
      the last two seconds only his head pokes out of the pile, one pinecone sitting
      on top of his bucket hat, and he gives the camera a flat, unimpressed
      look, then breaks into a sheepish grin.
    camera: static medium shot, slight low angle, the tree branches and the bear and the ground around him in frame
    continuity: the mustard-yellow bucket hat stays on his head (only pushed down and back up) and the red backpack stays on; the pinecones stay brown and are ordinary pine cone sized; the pile buries him only up to his chin, his face always visible
    sfx: rustling branches, a soft hollow bonk, a surprised "hmph", a little catch thump, then a loud clattering rumble of many pinecones tumbling down, birdsong
  - id: s4_steep_hill
    duration: 5
    lock_clip: true
    keyframe_pick: 1
    beat: Steep hill
    keyframe: >-
      {name} wearing the mustard-yellow bucket hat and red backpack, halfway up
      a steep grassy hillside, leaning far forward and climbing on all fours
      with paws and feet in the grass, determined puffed-cheek face, the top of
      the hill above him, NOT yet slipping
    motion: >-
      {name} huffs and puffs and crawls a little higher up the steep grass,
      then his feet slip out from under him. He slides backward down the slope
      on his tummy, then curls into a round furry ball and rolls all the way to
      the bottom of the hill, his hat and backpack staying on as he tumbles. He lands
      sitting up in a soft patch of wildflowers at the bottom, a daisy stuck on
      his hat, blinks dizzily, then shakes his head, gives a little
      determined huff and stares back up the hill with a stubborn frown.
    camera: static wide side view, the whole hillside from top to bottom in frame
    continuity: the mustard-yellow bucket hat and red backpack stay on him the whole time, even while rolling
    sfx: huffing breaths, grass swishing, a whoosh as he slides, soft tumbling thumps, a gentle flump into flowers
  - id: s5_summit
    duration: 5
    lock_clip: true
    keyframe_pick: 1
    beat: Summit
    keyframe: >-
      {name} wearing the mustard-yellow bucket hat and red backpack, standing
      on the tiny pointed rocky peak at the very top of a tall mountain, a
      small patch of grass just big enough for his feet; on both his left and
      right the mountainside drops away steeply into a deep valley far below,
      with soft clouds drifting BELOW the peak and a sea of smaller blue
      mountain tops stretching into the distance under a golden sunset sky;
      the camera looks slightly down and across so the long drop on both sides
      is clearly visible; he holds a small plain pastel-pink triangle flag on a
      wooden stick upright in one paw, out of breath but smiling, the flag NOT
      yet planted
    motion: >-
      {name} raises the little pink flag high and plants it firmly into the
      grass at the top of the hill with both paws. He steps back, plants his
      fists on his hips and puffs out his chest in a proud hero pose while a
      warm breeze makes the flag flutter. Then he flops down to sit beside the
      flag on the tiny peak, legs stretched out in front of him, pulls a small round glass jar
      of golden honey with no label out of his backpack and pops off the lid.
      He dips one paw deep into the jar, scoops out a big gooey dollop of honey
      that drips in long golden strings, licks it off his paw with eyes closed
      in bliss, then hugs the honey jar and gazes out at the view with a sticky,
      contented smile.
    camera: static wide shot, slightly high angle, the bear small on the pointed peak with the steep drop and clouds below on both sides in frame
    continuity: the mustard-yellow bucket hat and red backpack stay on; the flag stays plain pastel pink with no writing or symbols; the honey jar is plain clear glass with no label or writing
    sfx: warm wind, flag fluttering, a soft thunk as the flag is planted, a jar lid pop, a sticky slurp, a happy sigh, distant birds

music:
  duration: 25
  mood: cheerful adventurous hiking music with bouncy acoustic guitar, whistling-style flute melody, light hand percussion and pizzicato strings, building to a warm triumphant ending
