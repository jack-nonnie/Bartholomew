# Model endpoints on fal.ai and rough per-call cost estimates (USD).
# Estimates are for budgeting only — check real spend in output/<episode>/cost.json.
# Endpoints get verified against fal's catalog before the first paid run.
image_models:
  nano_banana_21: {endpoint: google/nano-banana-2.1/edit,          est_cost: 0.09}
  seedream55:    {endpoint: bytedance/seedream/v5.5/edit,         est_cost: 0.03}
  nano_banana:   {endpoint: fal-ai/nano-banana/edit,              est_cost: 0.0398}
  seedream:      {endpoint: fal-ai/bytedance/seedream/v4/edit,    est_cost: 0.03}
  kontext_multi: {endpoint: fal-ai/flux-pro/kontext/max/multi,    est_cost: 0.08}
video_models:
  # Prices from fal's pricing API (Nov 2026). Seedance bills per token (~108k tokens per 5s at 720p).
  kling_v4:        {endpoint: kling/v4/image-to-video,                    est_cost_per_sec: 0.157, native_audio: false, min_sec: 3}
  kling_v4_flash:  {endpoint: kling/v4/flash/image-to-video,              est_cost_per_sec: 0.094, native_audio: false, min_sec: 3}
  veo31_fast:      {endpoint: fal-ai/veo3.1/fast/image-to-video,          est_cost_per_sec: 0.15,  native_audio: true,  min_sec: 4}
  veo31_lite:      {endpoint: fal-ai/veo3.1/lite/image-to-video,          est_cost_per_sec: 0.05,  native_audio: true,  min_sec: 4}
  seedance25:      {endpoint: bytedance/seedance-2.5/us/image-to-video,   est_cost_per_sec: 0.46,  native_audio: true,  min_sec: 4}
  seedance25_flash: {endpoint: bytedance/seedance-2.5/flash/image-to-video, est_cost_per_sec: 0.30, native_audio: true, min_sec: 4}
audio_models:
  sfx:   {endpoint: fal-ai/mmaudio-v2,     est_cost: 0.01}   # video -> matching sound effects
  music: {endpoint: fal-ai/stable-audio,   est_cost: 0.05}   # text -> music bed
defaults:
  image_model: nano_banana_21
  video_model: kling_v4
  aspect_ratio: "9:16"
  resolution: 720p
