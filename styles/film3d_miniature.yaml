id: film3d_miniature
label: Animated bear, handmade miniature world
prompt: >-
  Handcrafted miniature dollhouse diorama photographed with a macro lens and strong
  tilt-shift blur. Every prop is visibly handmade at tiny scale: felt towels with
  stitched edges, balsa-wood furniture with visible grain and glue seams, paper
  leaves, painted cardboard walls, tiny LED-lit wax candles, cotton-ball foam. It
  reads clearly as a crafted tabletop set. The bear is a feature-film 3D animated
  character with fluffy fur and an expressive animated face, living in this tiny world.
negative: realistic full-size room, real plants, real towels, flat 2D cartoon, anime, text, watermark, logo
